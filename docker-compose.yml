services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ova-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=mock
      - DATABASE_URL=sqlite:///./dev.db
      - JWT_SECRET_KEY=ova-clinical-safety-secret-key-2026
      - CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173","http://localhost"]
    volumes:
      - backend-db:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ova-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  backend-db:
