    tolerance_absolute: 0.0
    tolerance_percent: null
    allowed_units: []

  fertilized_2pn:
    canonical_name: "fertilized_2pn"
    window_days: 14
    tolerance_absolute: 0.0
    tolerance_percent: null
    allowed_units: []

