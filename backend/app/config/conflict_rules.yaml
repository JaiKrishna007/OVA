# Clinical Conflict Detector Rules Configuration
# Reference: Section 16 of docs/PROJECT_SPEC.md

default:
  window_days: 60
  tolerance_absolute: null
  tolerance_percent: 5.0
  display_text: "Conflicting documented values. Clinician review required."

fields:
  amh:
    canonical_name: "amh"
    window_days: 90
    tolerance_absolute: 0.1
    tolerance_percent: null
    allowed_units:
      - "ng/mL"
      - "ng/ml"

  fsh:
    canonical_name: "fsh"
    window_days: 30
    tolerance_absolute: 0.5
    tolerance_percent: null
    allowed_units:
      - "mIU/mL"
      - "miu/ml"
      - "IU/L"
      - "iu/l"

  lh:
    canonical_name: "lh"
    window_days: 30
    tolerance_absolute: 0.5
    tolerance_percent: null
    allowed_units:
      - "mIU/mL"
      - "miu/ml"
      - "IU/L"
      - "iu/l"

  estradiol:
    canonical_name: "estradiol"
    window_days: 7
    tolerance_absolute: 25.0
    tolerance_percent: null
    allowed_units:
      - "pg/mL"
      - "pg/ml"

  progesterone:
    canonical_name: "progesterone"
    window_days: 7
    tolerance_absolute: 1.0
    tolerance_percent: null
    allowed_units:
      - "ng/mL"
      - "ng/ml"

  tsh:
    canonical_name: "tsh"
    window_days: 90
    tolerance_absolute: 0.3
    tolerance_percent: null
    allowed_units:
      - "mIU/L"
      - "miu/l"
      - "uIU/mL"
      - "uiu/ml"

  beta_hcg:
