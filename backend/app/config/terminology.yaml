# Terminology dictionary for OVA clinical entity and unit canonicalization
# Reference: Section 16 of docs/PROJECT_SPEC.md

terms:
  # Procedures
  OPU:
    canonical: "OPU"
    synonyms:
      - "OPU"
      - "Ovum Pickup"
      - "Ovum Pick Up"
      - "Oocyte Retrieval"
      - "Egg Retrieval"
      - "Oocyte Pick-up"
  EMBRYO_TRANSFER:
    canonical: "EMBRYO_TRANSFER"
    synonyms:
      - "ET"
      - "Embryo Transfer"
      - "Fresh Embryo Transfer"
      - "Fresh ET"
  FET:
    canonical: "FET"
    synonyms:
      - "FET"
      - "Frozen Embryo Transfer"
      - "Frozen Thawed Embryo Transfer"
  IUI:
    canonical: "IUI"
    synonyms:
      - "IUI"
      - "Intrauterine Insemination"
  OI:
    canonical: "OI"
    synonyms:
      - "OI"
      - "Ovulation Induction"
  TRIGGER:
    canonical: "TRIGGER"
    synonyms:
      - "Trigger"
      - "Ovulation Trigger"
      - "hCG Trigger"
      - "Lupron Trigger"
      - "Dual Trigger"
      - "Trigger Injection"
  STIMULATION:
    canonical: "STIMULATION"
    synonyms:
      - "Stimulation"
      - "Ovarian Stimulation"
      - "Controlled Ovarian Stimulation"
      - "COH"

# Medication canonicalization
drugs:
  "gonal-f": "Gonal-F"
